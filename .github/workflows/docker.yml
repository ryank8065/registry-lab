```yaml
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/registry-lab:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/registry-lab:latest \
            .

      - name: Start container
        run: |
          docker run -d \
            --name registry-test \
            -p 8080:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/registry-lab:${{ github.sha }}

      - name: Test application
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error http://localhost:8080 | grep -q "Version 2"; then
              echo "Application is ready and content is correct."
              exit 0
            fi

            echo "Application not ready yet. Attempt $i/10..."
            sleep 2
          done

          echo "Application did not become ready."
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f registry-test

      - name: Scan image for vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/registry-lab:${{ github.sha }}
          only-severities: critical,high
          only-fixed: true

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/registry-lab:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/registry-lab:latest
```